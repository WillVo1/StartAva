<!DOCTYPE html>
<html>
<head>
    <title>Nurse Ava</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f0f0; }
        #container { text-align: center; width: 400px; }
        #status { margin: 20px; font-size: 18px; }
        input { width: 100%; padding: 15px; font-size: 16px; border: 2px solid #007bff; border-radius: 5px; }
        button { width: 100%; padding: 15px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 5px; margin-top: 10px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div id="container">
        <h1>🩺 Nurse Ava</h1>
        <input id="input" placeholder="Type your message..." />
        <button id="send">Send</button>
        <div id="status">Ready</div>
    </div>
    <script>
        const ws = new WebSocket('ws://localhost:3000');
        const status = document.getElementById('status');
        const input = document.getElementById('input');
        const send = document.getElementById('send');

        send.onclick = () => {
            const text = input.value.trim();
            if (!text) return;
            
            ws.send(JSON.stringify({ type: 'text', text }));
            status.textContent = `You: ${text}`;
            input.value = '';
        };

        input.onkeypress = (e) => {
            if (e.key === 'Enter') send.click();
        };

        ws.onmessage = async (e) => {
            const data = JSON.parse(e.data);

            if (data.type === 'audio') {
                const audioData = atob(data.audio);
                const audioArray = new Uint8Array(audioData.length);
                for (let i = 0; i < audioData.length; i++) {
                    audioArray[i] = audioData.charCodeAt(i);
                }
                const audioBlob = new Blob([audioArray], { type: 'audio/mpeg' });
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = new Audio(audioUrl);
                
                status.textContent = `Ava: ${data.text}`;
                audio.play();
            }

            if (data.type === 'error') {
                status.textContent = 'Error: ' + data.message;
            }
        };
    </script>
</body>
</html>
